{% set name = "librosa" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 02b620aaf0a6b020f20f2d1ce635a3b8b8c2563a7b8e4ba3b7e2ca6e6247e680

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=48
    - wheel >=0.29.0
  run:
    - python
    - numba >=0.61.0
    - numpy >=2.1.0
    - scipy >=1.15.0
    - scikit-learn >=1.6.0
    - joblib >=1.2
    - decorator >=5.2.1
    - pysoundfile >=0.12.1
    - pooch >=1.7
    - soxr-python >=1.0.0
    - typing_extensions >=4.1.1
    - lazy_loader >=0.3
    - msgpack-python >=1.0.5
    # matplotlib powers librosa.display; optional upstream ("display" extra) but kept
    # in run so the commonly-used librosa.display module works on install (matches conda-forge).
    - matplotlib-base >=3.10.0

{% set skip_tests = "" %}
# missing resampy and samplerate for tests
{% set skip_tests = skip_tests + " --deselect=tests/test_core.py::test_resample_mono" %}
{% set skip_tests = skip_tests + " --deselect=tests/test_core.py::test_resample_stereo" %}
{% set skip_tests = skip_tests + " --deselect=tests/test_core.py::test_resample_scale" %}
{% set skip_tests = skip_tests + " --deselect=tests/test_multichannel.py::test_resample_multichannel" %}
{% set skip_tests = skip_tests + " --deselect=tests/test_multichannel.py::test_resample_highdim" %}
{% set skip_tests = skip_tests + " --deselect=tests/test_multichannel.py::test_resample_highdim_axis" %}
{% set skip_tests = skip_tests + " --deselect=tests/test_multichannel.py::test_nnls_multi" %}

# flaky on windows CI
# _tkinter.TclError: Cannot find a usable init.tcl in the following directories: 
{% set skip_tests = skip_tests + " --deselect=tests/test_display.py::test_sharex_waveplot_ms" %}  # [win]
{% set skip_tests = skip_tests + " --deselect=tests/test_display.py::test_coords" %}              # [win]
{% set skip_tests = skip_tests + " --deselect=tests/test_display.py::test_highlight_spectrum" %}  # [win]
{% set skip_tests = skip_tests + " --deselect=tests/test_display.py::test_cqt_note" %}            # [win]

test:
  source_files:
    - tests
  imports:
    - librosa
    - librosa.core
    - librosa.feature
    - librosa.util
    - librosa.display
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv {{ skip_tests }} tests

about:
  home: https://github.com/librosa/librosa
  license: ISC
  license_family: Other
  license_file: LICENSE.md
  summary: Python module for audio and music processing
  description: |
    librosa is a python package for music and audio analysis. It provides the
    building blocks necessary to create music information retrieval systems.
  doc_url: https://librosa.org/doc/latest/index.html
  dev_url: https://github.com/librosa/librosa

extra:
  recipe-maintainers:
    - bmcfee
