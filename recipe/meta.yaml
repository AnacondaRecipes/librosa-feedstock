{% set name = "librosa" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 73ed480d4022e436e85dfa6f6b06ff38a259b9210039ac99939cd64854b61a57

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=48
    - wheel >=0.29.0
  run:
    - python
    - numba >=0.61.0
    - numpy >=2.1.0
    - scipy >=1.15.0
    - scikit-learn >=1.6.0
    - joblib >=1.2
    - decorator >=5.2.1
    - pysoundfile >=0.12.1
    - pooch >=1.7
    - soxr-python >=1.0.0
    - typing_extensions >=4.1.1
    - lazy_loader >=0.3
    - msgpack-python >=1.0.5
    # matplotlib powers librosa.display; optional upstream ("display" extra) but kept
    # in run so the commonly-used librosa.display module works on install (matches conda-forge).
    - matplotlib-base >=3.10.0

test:
  requires:
    - pip
  imports:
    - librosa
    - librosa.core
    - librosa.feature
    - librosa.util
    - librosa.display
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://github.com/librosa/librosa
  license: ISC
  license_family: Other
  license_file: LICENSE.md
  summary: Python module for audio and music processing
  description: |
    librosa is a python package for music and audio analysis. It provides the
    building blocks necessary to create music information retrieval systems.
  doc_url: https://librosa.org/doc/latest/index.html
  dev_url: https://github.com/librosa/librosa

extra:
  recipe-maintainers:
    - bmcfee
